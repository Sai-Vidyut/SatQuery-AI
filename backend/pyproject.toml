[project]
name = "satquery-backend"
version = "0.1.0"
description = "SatQuery AI evidence-driven geospatial intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "tifffile>=2024.8.0",
    "numpy>=2.0.0",
    "rasterio>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
earth_engine = [
    "earthengine-api>=1.4.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
